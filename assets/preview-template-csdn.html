<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · CSDN 富文本预览</title>
<style>
  body{margin:0;background:#eef1f5;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;}
  .csdn-toolbar{position:fixed;top:0;left:0;right:0;height:54px;background:#ffffff;box-shadow:0 1px 10px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:99;}
  .csdn-hint{font-size:13px;color:#6b7280;line-height:1.4;}
  .csdn-hint b{color:#111827;}
  .csdn-copy{background:#e6000f;color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(230,0,15,.28);white-space:nowrap;transition:transform .08s,background .15s;}
  .csdn-copy:hover{background:#cc000d;}
  .csdn-copy:active{transform:translateY(1px);}
  .csdn-toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88vw;text-align:center;}
  .csdn-toast.show{opacity:1;}
  .csdn-stage{max-width:760px;margin:80px auto 64px;padding:28px 10px;}
  @media(max-width:520px){.csdn-hint{max-width:150px;}}
</style>
</head>
<body>
<div class="csdn-toolbar">
  <span class="csdn-hint">👇 下方是发布效果 · 点右侧 <b>复制</b> 直接粘到 CSDN 富文本编辑器</span>
  <button class="csdn-copy" id="csdnCopyBtn" onclick="csdnCopy()">📋 复制到 CSDN</button>
</div>
<div class="csdn-toast" id="csdnToast"></div>
<div class="csdn-stage">
  <div id="csdn-content">
<!--CSDN_CONTENT-->
  </div>
</div>
<script>
  function csdnShowToast(msg){
    var t=document.getElementById('csdnToast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(t._timer);
    t._timer=setTimeout(function(){t.classList.remove('show');},2800);
  }
  function csdnCopy(){
    var el=document.getElementById('csdn-content');
    var ok=false;
    // 优先用 ClipboardItem 复制带 HTML 的富文本（保留全部样式）
    if(window.ClipboardItem){
      var plain=el.innerText;
      var html='<div>'+el.innerHTML+'</div>';
      var c=new ClipboardItem({
        'text/html':new Blob([html],{type:'text/html'}),
        'text/plain':new Blob([plain],{type:'text/plain'})
      });
      navigator.clipboard.write([c]).then(function(){
        ok=true;csdnShowToast('✅ 已复制！到 CSDN 富文本编辑器按 Ctrl/⌘+V 粘贴');
      }).catch(function(){
        csdnFallback(el);
      });
    }else{
      csdnFallback(el);
    }
  }
  function csdnFallback(el){
    // 兼容 Safari / 旧浏览器：选中渲染节点后 execCommand('copy')
    var range=document.createRange();
    range.selectNodeContents(el);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    sel.removeAllRanges();
    if(ok){
      csdnShowToast('✅ 已复制！去 CSDN 编辑器按 Ctrl/⌘+V 粘贴即可');
    }else{
      csdnShowToast('⚠ 自动复制失败，请手动全选(Ctrl/⌘+A)再复制(Ctrl/⌘+C)');
    }
  }
</script>
</body>
</html>
